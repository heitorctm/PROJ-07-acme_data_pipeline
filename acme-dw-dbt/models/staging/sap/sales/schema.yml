      - name: installment_number
        description: Sequential installment number.
        tests:
          - not_null
      - name: due_date
        description: Installment due date.
      - name: installment_amount
        description: Installment amount.
      - name: paid_amount
        description: Amount already paid on the installment.
      - name: installment_status
        description: "Raw installment status (Status in INV6): 'O' (open) / 'C' (closed)."
      - name: _ingested_at
        description: Timestamp of when the record was ingested into the data warehouse.

  - name: sales_invoice_usage_inv12
    description: Fiscal usage of A/R invoices.
    columns:
      - name: doc_entry
