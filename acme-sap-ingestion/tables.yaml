# tables and columns to extract from SAP HANA
# format:
#
# TABLE_NAME:
#   object_type: table_name | view
#   strategy: incremental_append | incremental_upsert | incremental_via_header | full_reload | daily_snapshot
#   primary_key:
#     - PK_COLUMN
#   watermark_column: DATE_COLUMN
#   initial_load:
#     start: "YYYY-MM-DD"   # null = no date filter
#     end: "YYYY-MM-DD"      # null = no date filter
#     window_months: 3        # null = load everything at once
#   columns:
#     - COLUMN1
#     - COLUMN2
#
# tables with @ in the name need to be quoted:
#
# "@TABLE_NAME":
#   object_type: table
#   ...

