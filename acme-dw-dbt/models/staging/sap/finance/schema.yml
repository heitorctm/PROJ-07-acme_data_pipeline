version: 2

models:
  - name: journal_entry_ojdt
    description: Journal entry headers. One record per transaction.
    columns:
      - name: transaction_id
        description: Primary key of the accounting transaction.
        tests:
          - not_null
          - unique

  - name: journal_entry_lines_jdt1
    description: Journal entry lines. Composite key transaction_id + line_number.
    columns:
      - name: transaction_id
        description: Accounting transaction identifier (FK to OJDT).
        tests:
          - not_null
      - name: line_number
        description: Sequential line number within the journal entry.
        tests:
          - not_null

  - name: outgoing_payment_ovpm
    description: Outgoing payments (accounts payable). One record per payment.
    columns:
      - name: doc_entry
        description: SAP internal primary key.
        tests:
          - not_null
          - unique
      - name: payment_number
        description: User-facing payment number (DocNum).
      - name: payment_type
        description: "Payment type (DocType). Values: 'A' (Account), 'C' (Customer), 'S' (Supplier)."
      - name: payment_date
        description: Payment date (DocDate).
      - name: accrual_date
        description: Tax accrual date (TaxDate).
      - name: due_date
        description: Due date (DueDate).
      - name: updated_date
        description: Date the record was last updated (UpdateDate).
      - name: update_ts
        description: Update timestamp in seconds (watermark for incremental ingestion).
      - name: canceled
        description: "Indicates whether the payment was canceled. Values: Y, N (C — cancellation per the SDK, not observed in the database)."
      - name: partner_code
        description: Code of the partner receiving the payment (CardCode).
      - name: partner_name
        description: Partner name at the time of payment.
      - name: branch_id
        description: ID of the branch that made the payment (BPLId).
      - name: payment_total
        description: Total payment amount (DocTotal).
      - name: currency
        description: Document currency (DocCurr).
      - name: cash_amount
        description: Portion of the payment made in cash (CashSum).
      - name: transfer_amount
        description: Portion of the payment made via bank transfer (TrsfrSum).
      - name: check_amount
        description: Portion of the payment made via check (CheckSum).
      - name: credit_amount
        description: Portion of the payment made via credit (CreditSum).
      - name: amount_without_document
        description: Portion of the payment with no associated document (NoDocSum).
      - name: ledger_transaction_id
        description: ID of the journal entry generated by the payment (TransId) — direct join with OJDT.
      - name: historical
        description: Accounting memo/remark for the journal entry (JrnlMemo).
      - name: _ingested_at
        description: Timestamp of when the record was ingested into the data warehouse.

  - name: chart_of_accounts_oact
    description: Accounting chart of accounts.
    columns:
      - name: account_code
        description: Primary key of the accounting account in SAP (AcctCode).
        tests:
          - not_null
          - unique
