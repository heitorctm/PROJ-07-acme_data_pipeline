version: 2

models:
  - name: sales_invoice_oinv
    description: A/R invoice headers. One row per issued invoice.
    columns:
      - name: doc_entry
        description: SAP internal primary key. May appear multiple times — the raw table uses an incremental_append strategy that retains the document's version history.
        tests:
          - not_null
      - name: invoice_number
        description: User-facing invoice number.
      - name: issue_date
        description: Invoice issue date.
      - name: due_date
        description: Invoice due date.
      - name: creation_date
        description: Date the record was created in SAP.
      - name: updated_date
        description: Date the record was last updated.
      - name: update_ts
        description: Update timestamp in seconds (incremental ingestion watermark).
      - name: document_status
        description: "Raw invoice status (DocStatus): 'O' (open) / 'C' (closed). Translated in the int layer."
      - name: canceled
        description: "Raw cancellation status (CANCELED): 'N' (no) / 'Y' (canceled) / 'C' (reversal — document generated by SAP on cancellation). Translated in the int layer."
      - name: customer_code
        description: Customer code (business partner).
      - name: customer_name
        description: Customer name at the time of issuance.
      - name: salesperson_code
        description: Code of the responsible salesperson.
      - name: branch_id
        description: ID of the issuing branch.
      - name: branch_name
        description: Name of the issuing branch.
      - name: series_code
        description: Fiscal numbering series code.
      - name: series_number
        description: Sequential number within the series.
      - name: payment_method
        description: Payment method code.
      - name: ledger_transaction_id
        description: ID of the generated accounting transaction (join with OJDT.TransId).
      - name: accrual_date
        description: Fiscal accrual date of the invoice.
      - name: document_total
        description: Invoice total in local currency.
      - name: document_total_system_currency
        description: Invoice total in system currency.
      - name: gross_profit
        description: Gross profit calculated by SAP.
      - name: header_discount
        description: Discount applied at the invoice header level.
      - name: total_taxes
        description: Total taxes on the invoice.
      - name: nfe_amount
        description: NF-e amount transmitted to SEFAZ.
      - name: advance_payment
        description: Advance payment amount applied to the invoice.
      - name: paid_amount
        description: Amount already paid in system currency.
      - name: sales_type
        description: "Raw SAP value (isIns), passthrough — indicates whether there is an associated financial entry."
      - name: updates_inventory
        description: "Raw SAP flag (UpdInvnt), passthrough — indicates whether the invoice moves inventory."
      - name: notes
        description: Free-text notes field on the invoice (cleaned text).
      - name: external_ticket
        description: Ticket number in the external ticketing system (custom field).
      - name: external_ticket_date
        description: Ticket date in the external ticketing system (custom field).
      - name: load_kit
        description: "Raw load classification (U_LOAD_KIT): 'N' (retail) / 'S' (wholesale) / 'P' (pending/unclassified). Translated in the int layer."
      - name: store_code
        description: Linked store code (custom field U_Store).
      - name: presale_channel
        description: "Raw SAP presale channel (U_PRESALE), text code. Translated in the int layer."
      - name: in_protest
        description: "Raw SAP flag (U_PROTEST), passthrough — indicates whether the invoice is in protest."
      - name: finance_validated
        description: "Raw finance validation (U_FINANCE_VALIDATED): 'N' / 'S' / 'P'. Translated in the int layer (not validated / validated / pending)."
      - name: show_in_bi
        description: "Raw flag (U_SHOW_IN_BI): 'S' / 'N'. Translated in the int layer (yes/no). 'Force display' — GLOBAL OVERRIDE in the BI filter: document='yes' bypasses partner/intercompany/usage/canceled; see the filter policy."
      - name: triangulation
        description: >
          Fiscal triangular-operation classification (U_TRIANGULATION in SAP — typo at source).
          Raw values: 'C' (to be confirmed — default state, ~85% of invoices), 'S' (yes, it is a
          triangulation), 'N' (no). Exposed as an attribute and translated in the int layer
          (sales_invoice_documents); it is NOT filtered in any layer.
      - name: _ingested_at
        description: Timestamp of when the record was ingested into the data warehouse.

  - name: sales_invoice_lines_inv1
    description: A/R invoice lines. Composite key doc_entry + line_number.
    columns:
      - name: doc_entry
        description: Foreign key to OINV.
        tests:
          - not_null
      - name: line_number
        description: Sequential line number within the invoice.
        tests:
          - not_null
      - name: item_code
        description: Code of the sold item.
      - name: item_description
        description: Item description at the time of issuance.
      - name: quantity
        description: Quantity sold.
      - name: unit_price
        description: Unit price charged.
      - name: price_before_discount
        description: Unit price before discount.
      - name: discount_percentage
        description: Discount percentage applied to the line.
      - name: line_total
        description: Line total (quantity × price).
      - name: total_taxes
        description: Total taxes on the line.
      - name: inventory_cost_price
        description: Inventory cost price at the time of sale.
      - name: line_status
        description: "Raw line status (LineStatus): 'O' (open) / 'C' (closed). Translated in the int layer."
      - name: usage_id
        description: Fiscal usage ID of the line (join with OUSG).
      - name: cfop
        description: CFOP (Brazilian fiscal operation and service code).
      - name: warehouse_code
        description: Code of the source warehouse for the goods.
      - name: source_doc_entry
        description: doc_entry of the source document (order, quote, or return).
      - name: source_document_type
        description: "Source document type (BaseType). Values: Sales Order (17), Quotation (23), A/R Invoice (13 — supplementary/retransmission), No source (-1)."
      - name: bdi_price
        description: BDI price (custom field, text converted to decimal).
      - name: cost_price
        description: Cost price (custom field, text converted to decimal).
      - name: margin
        description: Contribution margin of the line (custom field, text converted to decimal).
      - name: _ingested_at
        description: Timestamp of when the record was ingested into the data warehouse.

  - name: sales_invoice_expenses_inv3
    description: Additional charges on A/R invoices (freight, insurance, etc.). Composite key doc_entry + line_number.
    columns:
      - name: doc_entry
        description: Foreign key to OINV.
        tests:
          - not_null
      - name: line_number
        description: Sequential expense-line number within the invoice.
        tests:
          - not_null
      - name: expense_code
        description: Additional charge code (join with OEXD).
      - name: expense_amount
        description: Additional charge amount.
      - name: _ingested_at
        description: Timestamp of when the record was ingested into the data warehouse.

  - name: sales_invoice_installments_inv6
