acme_dw:
  # 'dev' is the default target, but it is DISABLED on purpose: today there is only ONE
  # database instance — and it is PROD. The 'dev' output below FAILS immediately if used
  # (env var 'DBT_DEV_DESABILITADO' does not exist) — so a local `dbt run/build` WITHOUT
  # `--target prod` breaks with a clear message, instead of accidentally writing to production.
  # ALWAYS run locally with `--target prod`. dbt only resolves the SELECTED target, so
  # `--target prod` (Airflow/server) is NOT affected by this stub. Configure a real 'dev'
  # here once there is a separate dev database.
  target: dev
  outputs:
    dev:
      type: sqlserver
      driver: "ODBC Driver 18 for SQL Server"
      host: "{{ env_var('DBT_DEV_DESABILITADO') }}"
      database: "{{ env_var('DBT_DEV_DESABILITADO') }}"
      schema: dev_desabilitado
      user: "{{ env_var('DBT_DEV_DESABILITADO') }}"
      password: "{{ env_var('DBT_DEV_DESABILITADO') }}"
      trust_cert: true
      threads: 1
    prod:
      type: sqlserver
      driver: "ODBC Driver 18 for SQL Server"
      host: "{{ env_var('DBT_PROD_HOST') }}"
      port: "{{ env_var('DBT_PROD_PORT', '1433') | int }}"
      database: "{{ env_var('DBT_PROD_DATABASE') }}"
      schema: "{{ env_var('DBT_PROD_SCHEMA', 'SAP_MIRROR') }}"
      user: "{{ env_var('DBT_PROD_USER') }}"
      password: "{{ env_var('DBT_PROD_PASSWORD') }}"
      trust_cert: true
      threads: 8

# Profile read by the `edr` CLI to generate the observability report.
# Points to the same database as dbt, but with a fixed `elementary` schema (where the
# dbt elementary package materializes its tables).
elementary:
  # 'dev' DISABLED on purpose (only PROD exists today) — see the note in the acme_dw profile.
  # Local `edr`: run with `--profile-target prod`. The server (DAG) already passes --profile-target prod.
  target: dev
  outputs:
    dev:
      type: sqlserver
      driver: "ODBC Driver 18 for SQL Server"
      host: "{{ env_var('DBT_DEV_DESABILITADO') }}"
      database: "{{ env_var('DBT_DEV_DESABILITADO') }}"
      schema: elementary
      user: "{{ env_var('DBT_DEV_DESABILITADO') }}"
      password: "{{ env_var('DBT_DEV_DESABILITADO') }}"
      trust_cert: true
      threads: 1
    # prod: used by `edr` on the server (DAG elementary_report), internal route
    # + dbt user. Same DBT_PROD_* env vars as the dbt tasks.
    prod:
      type: sqlserver
      driver: "ODBC Driver 18 for SQL Server"
      host: "{{ env_var('DBT_PROD_HOST') }}"
      port: "{{ env_var('DBT_PROD_PORT', '1433') | int }}"
      database: "{{ env_var('DBT_PROD_DATABASE') }}"
      schema: elementary
      user: "{{ env_var('DBT_PROD_USER') }}"
      password: "{{ env_var('DBT_PROD_PASSWORD') }}"
      trust_cert: true
      threads: 8
